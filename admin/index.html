<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Administration — Quiz App</title>
<style>
    :root {
        --bg: #0f172a;
        --panel: #1e293b;
        --accent: #3b82f6;
        --accent-hover: #2563eb;
        --text: #e2e8f0;
        --text-muted: #94a3b8;
        --danger: #ef4444;
        --success: #22c55e;
        --border: #334155;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        font-family: "Segoe UI", Roboto, Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        padding: 30px;
    }
    h1 { margin-top: 0; }
    .config-bar {
        display: flex;
        gap: 10px;
        margin-bottom: 30px;
        flex-wrap: wrap;
        align-items: center;
    }
    input, select {
        background: var(--panel);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 8px 12px;
        border-radius: 6px;
        font-size: 14px;
    }
    button {
        background: var(--accent);
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
    }
    button:hover { background: var(--accent-hover); }
    button.danger { background: var(--danger); }
    button.danger:hover { background: #dc2626; }
    button.secondary { background: var(--border); }
    button.secondary:hover { background: #475569; }
    button.small { padding: 4px 10px; font-size: 12px; margin-right: 6px; }
    td input, td select { padding: 4px 8px; font-size: 13px; width: 100%; }
    .actions-cell { white-space: nowrap; }
    .panels {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 30px;
    }
    @media (max-width: 900px) {
        .panels { grid-template-columns: 1fr; }
    }
    .panel {
        background: var(--panel);
        border-radius: 10px;
        padding: 20px;
        border: 1px solid var(--border);
    }
    .panel h2 { margin-top: 0; }
    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 15px;
        font-size: 14px;
    }
    th, td {
        text-align: left;
        padding: 8px;
        border-bottom: 1px solid var(--border);
    }
    th { color: var(--text-muted); font-weight: 600; }
    .form-row {
        display: flex;
        gap: 8px;
        margin-top: 10px;
        flex-wrap: wrap;
    }
    .form-row input, .form-row select { flex: 1; min-width: 120px; }
    #statut {
        margin-bottom: 20px;
        padding: 10px;
        border-radius: 6px;
        display: none;
    }
    #statut.ok { display: block; background: rgba(34,197,94,0.15); color: var(--success); }
    #statut.erreur { display: block; background: rgba(239,68,68,0.15); color: var(--danger); }
</style>
</head>
<body>

<h1>Administration — Quiz App</h1>

<div class="config-bar">
    <input id="api-url" placeholder="URL du backend (ex: http://127.0.0.1:8000)" style="min-width:280px">
    <input id="api-key" type="password" placeholder="Clé admin (ADMIN_API_KEY)" style="min-width:220px">
    <button onclick="sauvegarderConfig()">Se connecter</button>
</div>

<div id="statut"></div>

<div class="panels">

    <div class="panel">
        <h2>Élèves</h2>
        <div class="form-row">
            <input id="eleve-matricule" placeholder="Matricule">
            <input id="eleve-nom" placeholder="Nom">
            <input id="eleve-ecole" placeholder="École">
            <button onclick="creerEleve()">Ajouter</button>
        </div>
        <table>
            <thead>
                <tr><th>Matricule</th><th>Nom</th><th>École</th><th></th></tr>
            </thead>
            <tbody id="tableau-eleves"></tbody>
        </table>
    </div>

    <div class="panel">
        <h2>Matières</h2>
        <div class="form-row">
            <input id="matiere-nom" placeholder="Nom de la matière">
            <select id="matiere-niveau">
                <option value="universitaire">Universitaire</option>
                <option value="secondaire">Secondaire</option>
            </select>
            <button onclick="creerMatiere()">Ajouter</button>
        </div>
        <table>
            <thead>
                <tr><th>Nom</th><th>Niveau</th><th></th></tr>
            </thead>
            <tbody id="tableau-matieres"></tbody>
        </table>
    </div>

</div>

<script>
    let API_URL = localStorage.getItem("quizapp_api_url") || "http://127.0.0.1:8000";
    let API_KEY = localStorage.getItem("quizapp_api_key") || "";

    let elevesCache = [];
    let matieresCache = [];
    let editionEleveId = null;
    let editionMatiereId = null;

    document.getElementById("api-url").value = API_URL;
    document.getElementById("api-key").value = API_KEY;

    function sauvegarderConfig() {
        API_URL = document.getElementById("api-url").value.trim().replace(/\/$/, "");
        API_KEY = document.getElementById("api-key").value.trim();
        localStorage.setItem("quizapp_api_url", API_URL);
        localStorage.setItem("quizapp_api_key", API_KEY);
        chargerTout();
    }

    function afficherStatut(message, ok) {
        const div = document.getElementById("statut");
        div.textContent = message;
        div.className = ok ? "ok" : "erreur";
        setTimeout(() => { div.className = ""; }, 4000);
    }

    async function appelApi(chemin, options = {}) {
        const reponse = await fetch(API_URL + chemin, {
            ...options,
            headers: {
                "Content-Type": "application/json",
                "X-Admin-Key": API_KEY,
                ...(options.headers || {}),
            },
        });
        if (!reponse.ok) {
            const erreur = await reponse.json().catch(() => ({}));
            throw new Error(erreur.detail || `Erreur ${reponse.status}`);
        }
        if (reponse.status === 200 && reponse.headers.get("content-length") !== "0") {
            return reponse.json();
        }
        return null;
    }

    async function chargerEleves() {
        elevesCache = await appelApi("/admin/eleves");
        afficherTableauEleves();
    }

    function afficherTableauEleves() {
        const corps = document.getElementById("tableau-eleves");
        corps.innerHTML = "";
        elevesCache.forEach(e => {
            const ligne = document.createElement("tr");
            if (editionEleveId === e.id) {
                ligne.innerHTML = `
                    <td><input id="edit-eleve-matricule-${e.id}" value="${e.matricule}"></td>
                    <td><input id="edit-eleve-nom-${e.id}" value="${e.nom}"></td>
                    <td><input id="edit-eleve-ecole-${e.id}" value="${e.ecole}"></td>
                    <td class="actions-cell">
                        <button class="small" onclick="enregistrerEleve(${e.id})">Enregistrer</button>
                        <button class="small secondary" onclick="annulerEditionEleve()">Annuler</button>
                    </td>
                `;
            } else {
                ligne.innerHTML = `
                    <td>${e.matricule}</td>
                    <td>${e.nom}</td>
                    <td>${e.ecole}</td>
                    <td class="actions-cell">
                        <button class="small" onclick="modifierEleve(${e.id})">Modifier</button>
                        <button class="small danger" onclick="supprimerEleve(${e.id})">Supprimer</button>
                    </td>
                `;
            }
            corps.appendChild(ligne);
        });
    }

    function modifierEleve(id) {
        editionEleveId = id;
        afficherTableauEleves();
    }

    function annulerEditionEleve() {
        editionEleveId = null;
        afficherTableauEleves();
    }

    async function enregistrerEleve(id) {
        const matricule = document.getElementById(`edit-eleve-matricule-${id}`).value.trim();
        const nom = document.getElementById(`edit-eleve-nom-${id}`).value.trim();
        const ecole = document.getElementById(`edit-eleve-ecole-${id}`).value.trim();
        if (!matricule || !nom || !ecole) {
            afficherStatut("Veuillez remplir tous les champs élève.", false);
            return;
        }
        try {
            await appelApi(`/admin/eleves/${id}`, { method: "PUT", body: JSON.stringify({ matricule, nom, ecole }) });
            editionEleveId = null;
            afficherStatut("Élève modifié.", true);
            await chargerEleves();
        } catch (e) {
            afficherStatut(e.message, false);
        }
    }

    async function creerEleve() {
        const matricule = document.getElementById("eleve-matricule").value.trim();
        const nom = document.getElementById("eleve-nom").value.trim();
        const ecole = document.getElementById("eleve-ecole").value.trim();
        if (!matricule || !nom || !ecole) {
            afficherStatut("Veuillez remplir tous les champs élève.", false);
            return;
        }
        try {
            await appelApi("/admin/eleves", { method: "POST", body: JSON.stringify({ matricule, nom, ecole }) });
            document.getElementById("eleve-matricule").value = "";
            document.getElementById("eleve-nom").value = "";
            document.getElementById("eleve-ecole").value = "";
            afficherStatut("Élève ajouté.", true);
            chargerEleves();
        } catch (e) {
            afficherStatut(e.message, false);
        }
    }

    async function supprimerEleve(id) {
        if (!confirm("Supprimer cet élève ?")) return;
        try {
            await appelApi(`/admin/eleves/${id}`, { method: "DELETE" });
            afficherStatut("Élève supprimé.", true);
            chargerEleves();
        } catch (e) {
            afficherStatut(e.message, false);
        }
    }

    async function chargerMatieres() {
        matieresCache = await appelApi("/admin/matieres");
        afficherTableauMatieres();
    }

    function afficherTableauMatieres() {
        const corps = document.getElementById("tableau-matieres");
        corps.innerHTML = "";
        matieresCache.forEach(m => {
            const ligne = document.createElement("tr");
            if (editionMatiereId === m.id) {
                ligne.innerHTML = `
                    <td><input id="edit-matiere-nom-${m.id}" value="${m.nom}"></td>
                    <td>
                        <select id="edit-matiere-niveau-${m.id}">
                            <option value="universitaire" ${m.niveau === "universitaire" ? "selected" : ""}>Universitaire</option>
                            <option value="secondaire" ${m.niveau === "secondaire" ? "selected" : ""}>Secondaire</option>
                        </select>
                    </td>
                    <td class="actions-cell">
                        <button class="small" onclick="enregistrerMatiere(${m.id})">Enregistrer</button>
                        <button class="small secondary" onclick="annulerEditionMatiere()">Annuler</button>
                    </td>
                `;
            } else {
                ligne.innerHTML = `
                    <td>${m.nom}</td>
                    <td>${m.niveau}</td>
                    <td class="actions-cell">
                        <button class="small" onclick="modifierMatiere(${m.id})">Modifier</button>
                        <button class="small danger" onclick="supprimerMatiere(${m.id})">Supprimer</button>
                    </td>
                `;
            }
            corps.appendChild(ligne);
        });
    }

    function modifierMatiere(id) {
        editionMatiereId = id;
        afficherTableauMatieres();
    }

    function annulerEditionMatiere() {
        editionMatiereId = null;
        afficherTableauMatieres();
    }

    async function enregistrerMatiere(id) {
        const nom = document.getElementById(`edit-matiere-nom-${id}`).value.trim();
        const niveau = document.getElementById(`edit-matiere-niveau-${id}`).value;
        if (!nom) {
            afficherStatut("Veuillez entrer un nom de matière.", false);
            return;
        }
        try {
            await appelApi(`/admin/matieres/${id}`, { method: "PUT", body: JSON.stringify({ nom, niveau }) });
            editionMatiereId = null;
            afficherStatut("Matière modifiée.", true);
            await chargerMatieres();
        } catch (e) {
            afficherStatut(e.message, false);
        }
    }

    async function creerMatiere() {
        const nom = document.getElementById("matiere-nom").value.trim();
        const niveau = document.getElementById("matiere-niveau").value;
        if (!nom) {
            afficherStatut("Veuillez entrer un nom de matière.", false);
            return;
        }
        try {
            await appelApi("/admin/matieres", { method: "POST", body: JSON.stringify({ nom, niveau }) });
            document.getElementById("matiere-nom").value = "";
            afficherStatut("Matière ajoutée.", true);
            chargerMatieres();
        } catch (e) {
            afficherStatut(e.message, false);
        }
    }

    async function supprimerMatiere(id) {
        if (!confirm("Supprimer cette matière ?")) return;
        try {
            await appelApi(`/admin/matieres/${id}`, { method: "DELETE" });
            afficherStatut("Matière supprimée.", true);
            chargerMatieres();
        } catch (e) {
            afficherStatut(e.message, false);
        }
    }

    async function chargerTout() {
        try {
            await Promise.all([chargerEleves(), chargerMatieres()]);
        } catch (e) {
            afficherStatut(e.message, false);
        }
    }

    if (API_KEY) chargerTout();
</script>

</body>
</html>
